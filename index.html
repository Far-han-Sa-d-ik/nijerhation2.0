<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f7">
  <title>Photo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 0;
      background: #f4f5f7;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100vh;
      object-fit: contain;
    }
    @media (min-aspect-ratio: 1/1) {
      img {
        width: auto;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <img src="nahian.jpg" alt="Portrait">
</body>
</html>
